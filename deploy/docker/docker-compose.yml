# Local development infrastructure.
#   docker compose up -d     start
#   docker compose down      stop (data is kept)
#   docker compose down -v   stop and delete local data

services:
  postgres:
    image: postgres:18-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nexus_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - nexus-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexus-pgdata:
