# Defaults are for local development only; override them with environment variables.
spring:
  application:
    name: core-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DATABASE_USER:nexus}
    password: ${DATABASE_PASSWORD:nexus_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

nexus:
  security:
    # At least 32 characters. Set a long random value outside local development.
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    token-lifetime: PT8H
    # Created at the first start, only when no user exists yet.
    initial-owner:
      username: ${NEXUS_OWNER_USERNAME:owner}
      password: ${NEXUS_OWNER_PASSWORD:change-me-please}

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
